# Production overlay — fronted by an external, shared Traefik instance.
#
#   cd web
#   echo "CHESS_DOMAIN=chess.example.com" > .env      # set your real subdomain once
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Assumes Traefik is already running on an external Docker network named `proxy`,
# with a TLS entrypoint `websecure` and a Let's Encrypt cert resolver `le`.
#
# Routing: everything on https://$CHESS_DOMAIN goes to the frontend, except /api/*
# which goes to the gateway. Same origin => no CORS needed in the browser.
# No host ports are published — Traefik is the only ingress.
services:
  gateway:
    networks:
      - chessnet
      - proxy
    environment:
      CORS_ORIGINS: https://${CHESS_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.chess-api.rule=Host(`${CHESS_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.chess-api.entrypoints=websecure"
      - "traefik.http.routers.chess-api.tls.certresolver=le"
      - "traefik.http.services.chess-api.loadbalancer.server.port=8000"

  frontend:
    # No build-arg: client uses relative "/api", Traefik routes <domain>/api to
    # the gateway (same origin). The same image works on any domain.
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.chess-web.rule=Host(`${CHESS_DOMAIN}`)"
      - "traefik.http.routers.chess-web.entrypoints=websecure"
      - "traefik.http.routers.chess-web.tls.certresolver=le"
      - "traefik.http.services.chess-web.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
