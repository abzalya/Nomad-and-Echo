name: build and push images

# Build all chess service images for both CPU architectures (amd64 for the
# Mac Pro, arm64 for the Raspberry Pi) and push them to GitHub Container
# Registry (GHCR). One image per service, tagged with the commit SHA and,
# on the default branch, `latest`.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "nomad/**"
      - "echo/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {} # allow manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read # checkout
      packages: write # push to GHCR

    strategy:
      fail-fast: false # one service failing shouldn't cancel the others
      matrix:
        include:
          - service: nomad
            context: .
            file: web/nomad/dockerfile
            image: ghcr.io/abzalya/chess-nomad
          - service: echo
            context: .
            file: web/echo/dockerfile
            image: ghcr.io/abzalya/chess-echo
          - service: gateway
            context: .
            file: web/gateway/dockerfile
            image: ghcr.io/abzalya/chess-gateway
          - service: frontend
            context: web/frontend
            file: web/frontend/dockerfile
            image: ghcr.io/abzalya/chess-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets the amd64 runner emulate arm64 so we can build for the Pi.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx is the multi-arch builder engine.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR using the token GitHub injects automatically.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate tags + labels: the commit SHA always, plus `latest` on main.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # speed up repeat builds by caching layers in GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
